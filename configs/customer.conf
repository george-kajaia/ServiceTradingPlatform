# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name customer.service-tokens.com;

    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name customer.service-tokens.com;

    # Issue this certificate before enabling: sudo certbot certonly --nginx -d customer.service-tokens.com
    ssl_certificate     /etc/letsencrypt/live/customer.service-tokens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customer.service-tokens.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/customer.service-tokens.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;

    root  /var/www/ServiceTokenUI/Customer;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ── Legacy domain: investor.service-tokens.com → customer ─────
# Keeps old links, bookmarks and installed PWAs working.
# Uses the existing investor certificate.
server {
    listen 80;
    listen [::]:80;
    server_name investor.service-tokens.com;

    return 301 https://customer.service-tokens.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name investor.service-tokens.com;

    ssl_certificate     /etc/letsencrypt/live/investor.service-tokens.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/investor.service-tokens.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/investor.service-tokens.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://customer.service-tokens.com$request_uri;
}
