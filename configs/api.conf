# ── CORS origin map ───────────────────────────────────────────
# Kept for potential future use, but CORS is now handled by .NET
map $http_origin $cors_origin {
    default                                    "";
    "https://company.service-tokens.com"       "https://company.service-tokens.com";
    "https://customer.service-tokens.com"      "https://customer.service-tokens.com";
    "https://investor.service-tokens.com"      "https://investor.service-tokens.com";
    "https://admin.service-tokens.com"         "https://admin.service-tokens.com";
}

# ── HTTP → HTTPS redirect (API domain) ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name service-tokens.com;
    return 301 https://service-tokens.com$request_uri;
}

# ── HTTP → HTTPS redirect (landing page) ──────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.service-tokens.com;
    return 301 https://www.service-tokens.com$request_uri;
}

# ── Landing page (www) ────────────────────────────────────────
# Static site from Web Apps/LandingPageUI.
# Certificate for service-tokens.com also covers www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.service-tokens.com;

    ssl_certificate         /etc/letsencrypt/live/service-tokens.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/service-tokens.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/service-tokens.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;

    root  /var/www/ServiceTokenUI/Landing;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # Icons rarely change; cache for a week (not immutable — file names aren't hashed)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    7d;
        access_log off;
    }

    # The API, hubs and Swagger live on service-tokens.com, not www
    location ~ ^/(api|hubs|swagger)/ {
        return 301 https://service-tokens.com$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}

# ── HTTPS main (API) ──────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name service-tokens.com;

    ssl_certificate         /etc/letsencrypt/live/service-tokens.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/service-tokens.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/service-tokens.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;

    # ── SignalR Hubs ──────────────────────────────────────────
    # WebSocket upgrade headers are mandatory for SignalR.
    # proxy_read_timeout is extended to keep long-lived
    # connections alive.
    location /hubs/ {
        proxy_pass            http://127.0.0.1:5001/hubs/;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ── REST API ──────────────────────────────────────────────
    # CORS is handled entirely by the .NET API — do not add
    # any CORS headers here or they will be duplicated.
    location /api/ {
        proxy_pass            http://127.0.0.1:5001/api/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        client_max_body_size  50m;
    }

    # ── Swagger UI ────────────────────────────────────────────
    location /swagger/ {
        proxy_pass            http://127.0.0.1:5001/swagger/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_redirect        off;
    }

    # ── Root → landing page ───────────────────────────────────
    # Visitors typing service-tokens.com land on www.
    # Swagger is still at https://service-tokens.com/swagger/index.html
    location = / {
        return 301 https://www.service-tokens.com/;
    }

    # ── Block everything else ─────────────────────────────────
    location / {
        return 404;
    }
}
